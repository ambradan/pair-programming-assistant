<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PPA — Pair Programming Assistant</title>
  <style>
    :root {
      --bg-primary: #1e1e2e;
      --bg-secondary: #2d2d3f;
      --bg-tertiary: #363649;
      --text-primary: #cdd6f4;
      --text-secondary: #a6adc8;
      --accent: #89b4fa;
      --accent-hover: #74c7ec;
      --green: #a6e3a1;
      --red: #f38ba8;
      --yellow: #f9e2af;
      --border: #45475a;
      --code-bg: #181825;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
    }

    .header h1 { font-size: 14px; font-weight: 600; color: var(--accent); }

    .status-bar {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      display: inline-block; margin-right: 4px;
    }
    .status-dot.connected { background: var(--green); }
    .status-dot.disconnected { background: var(--red); }

    .main { flex: 1; display: flex; overflow: hidden; }

    .left-panel {
      width: 400px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--bg-secondary);
    }

    .input-area {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }

    .input-area textarea {
      width: 100%; height: 80px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      padding: 10px; font-size: 13px;
      font-family: inherit; resize: none;
    }
    .input-area textarea:focus { outline: none; border-color: var(--accent); }

    .input-controls { display: flex; gap: 8px; margin-top: 8px; }

    .btn {
      padding: 6px 14px; border: none; border-radius: 4px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--accent); color: var(--bg-primary); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: var(--bg-tertiary); color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-opus { background: var(--yellow); color: var(--bg-primary); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .model-indicator {
      margin-left: auto; font-size: 11px;
      color: var(--text-secondary);
      display: flex; align-items: center; gap: 4px;
    }

    .reasoning-panel {
      flex: 1; overflow-y: auto; padding: 12px;
      font-size: 13px; line-height: 1.5;
    }

    .reasoning-section { margin-bottom: 16px; }
    .reasoning-section h3 {
      font-size: 11px; text-transform: uppercase;
      color: var(--accent); margin-bottom: 6px; letter-spacing: 0.5px;
    }
    .reasoning-section p { color: var(--text-secondary); }

    .alternative {
      background: var(--bg-tertiary); border-radius: 4px;
      padding: 8px; margin-top: 6px;
    }
    .alternative .label { color: var(--yellow); font-weight: 600; }
    .alternative .why-not { color: var(--text-secondary); font-size: 12px; }

    .right-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .nav-bar {
      display: flex; align-items: center;
      padding: 6px 12px; background: var(--bg-secondary);
      border-bottom: 1px solid var(--border); gap: 8px;
    }

    .file-link {
      font-size: 12px; color: var(--accent);
      font-family: 'Consolas', 'Courier New', monospace;
      text-decoration: none; cursor: pointer;
    }
    .file-link:hover { text-decoration: underline; color: var(--accent-hover); }

    .nav-bar .nav-buttons { margin-left: auto; display: flex; gap: 4px; }

    .nav-btn {
      padding: 3px 10px; border: 1px solid var(--border);
      background: var(--bg-tertiary); color: var(--text-primary);
      border-radius: 3px; font-size: 12px; cursor: pointer;
    }
    .nav-btn:hover { background: var(--accent); color: var(--bg-primary); }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .nav-counter { font-size: 11px; color: var(--text-secondary); }

    .diff-container { flex: 1; display: flex; overflow: hidden; }

    .diff-pane {
      flex: 1; overflow: auto; padding: 0;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 13px; line-height: 1.6;
    }
    .diff-pane.original { border-right: 1px solid var(--border); }

    .diff-pane-header {
      position: sticky; top: 0; padding: 4px 12px;
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px; z-index: 1;
    }
    .diff-pane.original .diff-pane-header { background: rgba(243, 139, 168, 0.15); color: var(--red); }
    .diff-pane.proposed .diff-pane-header { background: rgba(166, 227, 161, 0.15); color: var(--green); }

    .code-line { display: flex; padding: 0 12px; white-space: pre; }
    .line-number {
      width: 40px; text-align: right; color: var(--text-secondary);
      opacity: 0.5; padding-right: 12px; user-select: none; flex-shrink: 0;
    }
    .line-content { flex: 1; }
    .line-removed { background: rgba(243, 139, 168, 0.1); }
    .line-added { background: rgba(166, 227, 161, 0.1); }

    .explanation-bar {
      padding: 10px 16px; background: var(--bg-secondary);
      border-top: 1px solid var(--border); display: flex; gap: 24px;
    }
    .explanation-box { flex: 1; }
    .explanation-box h4 {
      font-size: 10px; text-transform: uppercase;
      color: var(--accent); margin-bottom: 4px; letter-spacing: 0.5px;
    }
    .explanation-box p { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }

    .loading {
      display: flex; align-items: center; justify-content: center;
      height: 100%; color: var(--text-secondary);
    }
    .spinner {
      width: 24px; height: 24px;
      border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; color: var(--text-secondary);
      font-size: 14px; gap: 8px;
    }
    .empty-state .shortcut {
      font-size: 12px; color: var(--accent);
      background: var(--bg-tertiary); padding: 2px 8px;
      border-radius: 3px; font-family: monospace;
    }

    /* Project source input */
    .project-source {
      width: 100%; margin-top: 8px;
    }
    .project-source label {
      font-size: 11px; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.5px;
      display: block; margin-bottom: 4px;
    }
    .project-source-row {
      display: flex; gap: 6px; align-items: center;
    }
    .project-source input {
      flex: 1; padding: 6px 8px;
      background: var(--bg-tertiary); border: 1px solid var(--border);
      border-radius: 4px; color: var(--text-primary);
      font-size: 12px; font-family: monospace;
    }
    .project-source input:focus { outline: none; border-color: var(--accent); }
    .source-badge {
      font-size: 10px; padding: 2px 6px; border-radius: 3px;
      font-weight: 600; text-transform: uppercase; flex-shrink: 0;
    }
    .source-badge.local { background: var(--green); color: var(--bg-primary); }
    .source-badge.git { background: var(--yellow); color: var(--bg-primary); }
    .clone-status {
      font-size: 11px; color: var(--text-secondary);
      margin-top: 4px; min-height: 16px;
    }

    /* Dependent file links */
    .dep-link {
      color: var(--accent); cursor: pointer; text-decoration: none;
      font-family: monospace; font-size: 12px;
    }
    .dep-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <h1>&#x1F916; PPA — Pair Programming Assistant</h1>
    <div class="status-bar">
      <span><span class="status-dot" id="apiStatus"></span><span id="apiStatusText">Checking...</span></span>
      <span id="modelInfo"></span>
      <span id="latencyInfo"></span>
    </div>
  </div>

  <div class="main">
    <div class="left-panel">
      <div class="input-area">
        <textarea
          id="messageInput"
          placeholder="Describe what you need...&#10;&#10;e.g. 'add input validation to the booking endpoint'"
        ></textarea>
        <div class="input-controls">
          <button class="btn btn-primary" id="sendBtn" onclick="sendAssist()">
            Send (Ctrl+Enter)
          </button>
          <button class="btn btn-opus" id="opusBtn" onclick="sendAssist('opus')" title="Force Opus for complex requests">
            &#x26A1; Opus
          </button>
          <button class="btn btn-secondary" id="reindexBtn" onclick="reindexProject()">
            &#x1F504; Re-index
          </button>
          <div class="model-indicator" id="lastModel"></div>
        </div>
        <div class="project-source">
          <label>Project source</label>
          <div class="project-source-row">
            <span class="source-badge local" id="sourceBadge">LOCAL</span>
            <input type="text" id="projectPath"
              value=""
              placeholder="C:\path\to\project  or  https://github.com/user/repo"
              oninput="detectSourceType()"
            />
          </div>
          <div class="clone-status" id="cloneStatus"></div>
        </div>
      </div>

      <div class="reasoning-panel" id="reasoningPanel">
        <div class="empty-state">
          <div>Type a request and press <span class="shortcut">Ctrl+Enter</span></div>
          <div style="font-size:12px;margin-top:8px;color:var(--text-secondary)">
            Accepts local paths or GitHub URLs
          </div>
        </div>
      </div>
    </div>

    <div class="right-panel">
      <div class="nav-bar" id="navBar" style="display:none;">
        <a class="file-link" id="currentFile" href="#" target="_blank">—</a>
        <div class="nav-buttons">
          <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>&#x2190; Prev</button>
          <span class="nav-counter" id="navCounter">0/0</span>
          <button class="nav-btn" id="nextBtn" onclick="navigate(1)" disabled>Next &#x2192;</button>
          <span style="width:1px;height:20px;background:var(--border);margin:0 4px"></span>
          <button class="nav-btn" id="applyBtn" onclick="applyChange(currentChangeIndex)" style="background:var(--green);color:var(--bg-primary)">&#x2713; Apply</button>
          <button class="nav-btn" id="applyAllBtn" onclick="applyAllChanges()" style="background:var(--green);color:var(--bg-primary)">&#x2713;&#x2713; Apply All</button>
          <button class="nav-btn" id="revertBtn" onclick="revertChange(currentChangeIndex)" style="background:var(--red);color:var(--bg-primary)">&#x21A9; Revert</button>
        </div>
      </div>

      <div class="diff-container" id="diffContainer">
        <div class="empty-state" id="emptyDiff">
          <div style="font-size: 48px; opacity: 0.3;">&#x2328;</div>
          <div>Code changes will appear here</div>
        </div>
      </div>

      <div class="explanation-bar" id="explanationBar" style="display:none;">
        <div class="explanation-box">
          <h4>&#x1F527; Technical</h4>
          <p id="technicalExpl">—</p>
        </div>
        <div class="explanation-box">
          <h4>&#x1F4A1; Plain English</h4>
          <p id="plainExpl">—</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin + '/api';
    let currentResponse = null;
    let currentChangeIndex = 0;
    let resolvedProjectPath = ''; // actual path used by backend (local or cloned)

    // Keyboard shortcuts
    document.getElementById('messageInput').addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); sendAssist(); }
    });
    document.addEventListener('keydown', (e) => {
      if (!currentResponse) return;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { navigate(-1); e.preventDefault(); }
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { navigate(1); e.preventDefault(); }
    });

    checkStatus();

    // --- Source type detection ---
    function isGitUrl(value) {
      return /^https?:\/\/(github\.com|gitlab\.com|bitbucket\.org)\//i.test(value.trim())
        || /^git@/i.test(value.trim())
        || value.trim().endsWith('.git');
    }

    function detectSourceType() {
      const value = document.getElementById('projectPath').value;
      const badge = document.getElementById('sourceBadge');
      const status = document.getElementById('cloneStatus');
      if (isGitUrl(value)) {
        badge.textContent = 'GIT';
        badge.className = 'source-badge git';
        status.textContent = 'Will clone on first request';
      } else {
        badge.textContent = 'LOCAL';
        badge.className = 'source-badge local';
        status.textContent = '';
      }
    }

    // --- Resolve project path (clone if git) ---
    async function resolveProjectPath() {
      const raw = document.getElementById('projectPath').value.trim();
      if (!raw) throw new Error('Set the project path first');

      if (!isGitUrl(raw)) {
        resolvedProjectPath = raw;
        return raw;
      }

      // Clone via backend
      const status = document.getElementById('cloneStatus');
      status.textContent = '⏳ Cloning repository...';

      const res = await fetch(`${API_BASE}/clone`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ gitUrl: raw }),
      });
      const json = await res.json();
      if (!res.ok || json.error) throw new Error(json.message || 'Clone failed');

      resolvedProjectPath = json.data.localPath;
      status.textContent = `✅ Cloned to ${json.data.localPath}`;
      return json.data.localPath;
    }

    // --- Build vscode:// link ---
    function buildVSCodeLink(projectPath, file, line) {
      const fullPath = projectPath.replace(/\//g, '\\') + '\\' + file.replace(/\//g, '\\');
      return `vscode://file/${encodeURI(fullPath.replace(/\\/g, '/'))}:${line || 1}`;
    }

    // --- API Status ---
    async function checkStatus() {
      try {
        const res = await fetch(`${API_BASE}/status`);
        const data = await res.json();
        document.getElementById('apiStatus').className = 'status-dot connected';
        document.getElementById('apiStatusText').textContent =
          `API OK | Anthropic: ${data.anthropicConfigured ? '✔' : '✗'}`;
      } catch {
        document.getElementById('apiStatus').className = 'status-dot disconnected';
        document.getElementById('apiStatusText').textContent = 'API Offline';
      }
    }

    // --- Main assist ---
    async function sendAssist(forceModel) {
      const message = document.getElementById('messageInput').value.trim();
      if (!message) return;

      document.getElementById('sendBtn').disabled = true;
      document.getElementById('sendBtn').textContent = '⏳ Thinking...';
      document.getElementById('diffContainer').innerHTML =
        '<div class="loading"><div class="spinner"></div>Analyzing codebase...</div>';

      try {
        const projectPath = await resolveProjectPath();

        const res = await fetch(`${API_BASE}/assist`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, projectPath, forceModel }),
        });

        const json = await res.json();
        if (!res.ok || json.error) throw new Error(json.message || json.error || `API returned ${res.status}`);

        const data = json.data;
        if (!data) throw new Error('No data in response');

        currentResponse = data;
        currentChangeIndex = 0;

        document.getElementById('lastModel').textContent = `${data.model} • ${data.latencyMs}ms`;
        renderReasoning(data);

        if (data.changes.length > 0) {
          document.getElementById('navBar').style.display = 'flex';
          document.getElementById('explanationBar').style.display = 'flex';
          renderChange(0);
          updateNavigation();
        } else {
          document.getElementById('diffContainer').innerHTML =
            '<div class="empty-state"><div>No code changes proposed</div><div style="font-size:12px;color:var(--text-secondary)">Try being more specific.</div></div>';
        }
      } catch (err) {
        document.getElementById('diffContainer').innerHTML =
          `<div class="empty-state" style="color:var(--red)">Error: ${escapeHtml(err.message)}</div>`;
      } finally {
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('sendBtn').textContent = 'Send (Ctrl+Enter)';
      }
    }

    // --- Reasoning panel ---
    function renderReasoning(data) {
      const panel = document.getElementById('reasoningPanel');
      let html = `
        <div class="reasoning-section">
          <h3>Intent</h3>
          <p><strong>${escapeHtml(data.intent.action)}</strong> → ${escapeHtml(data.intent.target)}
            (confidence: ${(data.intent.confidence * 100).toFixed(0)}%)</p>
        </div>
        <div class="reasoning-section">
          <h3>Why This Solution</h3>
          <p>${escapeHtml(data.reasoning.whyThisSolution)}</p>
        </div>
      `;

      if (data.reasoning.alternatives?.length > 0) {
        html += '<div class="reasoning-section"><h3>Alternatives Considered</h3>';
        for (const alt of data.reasoning.alternatives) {
          html += `
            <div class="alternative">
              <div class="label">${escapeHtml(alt.description)}</div>
              <div class="why-not">↳ ${escapeHtml(alt.whyNot)}</div>
            </div>
          `;
        }
        html += '</div>';
      }

      if (data.dependentFiles?.length > 0) {
        html += `
          <div class="reasoning-section">
            <h3>⚠ Also Affected</h3>
            <p>${data.dependentFiles.map(f =>
              `<a class="dep-link" href="${buildVSCodeLink(resolvedProjectPath, f, 1)}"
                  title="Open in VS Code">${escapeHtml(f)}</a>`
            ).join(', ')}</p>
          </div>
        `;
      }

      if (data.changes?.length > 0) {
        html += `
          <div class="reasoning-section">
            <h3>Files Modified</h3>
            <p>${data.changes.map((c, i) =>
              `<a class="dep-link" href="#" onclick="renderChange(${i});return false;"
                  title="Jump to change">${escapeHtml(c.file)}:${c.startLine}</a>`
            ).join('<br>')}</p>
          </div>
        `;
      }

      panel.innerHTML = html;
    }

    // --- Diff rendering ---
    function renderChange(index) {
      const change = currentResponse.changes[index];
      if (!change) return;

      const fileEl = document.getElementById('currentFile');
      const vsLink = buildVSCodeLink(resolvedProjectPath, change.file, change.startLine);
      fileEl.textContent = `${change.file} (L${change.startLine}–${change.endLine})`;
      fileEl.href = vsLink;
      fileEl.title = 'Open in VS Code';

      const container = document.getElementById('diffContainer');
      container.innerHTML = `
        <div class="diff-pane original">
          <div class="diff-pane-header">Original</div>
          ${renderCode(change.originalCode, change.startLine, 'removed')}
        </div>
        <div class="diff-pane proposed">
          <div class="diff-pane-header">Proposed</div>
          ${renderCode(change.proposedCode, change.startLine, 'added')}
        </div>
      `;

      document.getElementById('technicalExpl').textContent = change.explanation.technical;
      document.getElementById('plainExpl').textContent = change.explanation.plain;

      currentChangeIndex = index;
      updateNavigation();
    }

    function renderCode(code, startLine, type) {
      if (!code) return '<div class="code-line"><span class="line-content" style="color:var(--text-secondary)">(empty)</span></div>';
      return code.split('\n').map((line, i) => `
        <div class="code-line line-${type}">
          <span class="line-number">${startLine + i}</span>
          <span class="line-content">${escapeHtml(line)}</span>
        </div>
      `).join('');
    }

    function navigate(direction) {
      if (!currentResponse) return;
      const newIndex = currentChangeIndex + direction;
      if (newIndex >= 0 && newIndex < currentResponse.changes.length) renderChange(newIndex);
    }

    function updateNavigation() {
      if (!currentResponse) return;
      const total = currentResponse.changes.length;
      document.getElementById('navCounter').textContent = `${currentChangeIndex + 1}/${total}`;
      document.getElementById('prevBtn').disabled = currentChangeIndex === 0;
      document.getElementById('nextBtn').disabled = currentChangeIndex >= total - 1;
    }

    // --- Apply / Revert ---
    async function applyChange(index) {
      if (!currentResponse || !currentResponse.changes[index]) return;
      const change = currentResponse.changes[index];
      const btn = document.getElementById('applyBtn');
      btn.textContent = '⏳...'; btn.disabled = true;
      try {
        const res = await fetch(`${API_BASE}/apply`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ projectPath: resolvedProjectPath, changes: [change] }),
        });
        const json = await res.json();
        if (json.error) throw new Error(json.message);
        const result = json.data.results[0];
        if (result.status === 'applied') {
          btn.textContent = '✅ Done';
          currentResponse.changes[index]._applied = true;
        } else throw new Error(result.status);
      } catch (err) {
        alert(`Apply failed: ${err.message}`);
      } finally {
        btn.disabled = false;
        setTimeout(() => {
          btn.textContent = currentResponse.changes[index]?._applied ? '✅ Applied' : '✓ Apply';
        }, 1500);
      }
    }

    async function applyAllChanges() {
      if (!currentResponse || !currentResponse.changes.length) return;
      const btn = document.getElementById('applyAllBtn');
      btn.textContent = '⏳ Applying...'; btn.disabled = true;
      try {
        const res = await fetch(`${API_BASE}/apply`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ projectPath: resolvedProjectPath, changes: currentResponse.changes }),
        });
        const json = await res.json();
        if (json.error) throw new Error(json.message);
        const applied = json.data.results.filter(r => r.status === 'applied').length;
        const total = json.data.results.length;
        btn.textContent = applied === total ? `✅ All ${total} applied` : `⚠ ${applied}/${total}`;
        currentResponse.changes.forEach(c => c._applied = true);
      } catch (err) { alert(`Apply all failed: ${err.message}`); }
      finally {
        btn.disabled = false;
        setTimeout(() => { btn.textContent = '✓✓ Apply All'; }, 3000);
      }
    }

    async function revertChange(index) {
      if (!currentResponse || !currentResponse.changes[index]) return;
      const change = currentResponse.changes[index];
      const btn = document.getElementById('revertBtn');
      btn.textContent = '⏳...';
      try {
        const res = await fetch(`${API_BASE}/revert`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ projectPath: resolvedProjectPath, file: change.file }),
        });
        const json = await res.json();
        if (json.error) throw new Error(json.message);
        btn.textContent = '↩ Reverted';
        currentResponse.changes[index]._applied = false;
      } catch (err) { alert(`Revert failed: ${err.message}`); }
      finally { setTimeout(() => { btn.textContent = '↩ Revert'; }, 1500); }
    }

    async function reindexProject() {
      const btn = document.getElementById('reindexBtn');
      btn.textContent = '⏳ Indexing...'; btn.disabled = true;
      try {
        const projectPath = await resolveProjectPath();
        const res = await fetch(`${API_BASE}/index`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ projectPath }),
        });
        const { data } = await res.json();
        alert(`Indexed: ${data.filesIndexed} files, ${data.symbolsFound} symbols, ${data.dependencyEdges} deps`);
      } catch (err) { alert(`Index failed: ${err.message}`); }
      finally { btn.textContent = '🔄 Re-index'; btn.disabled = false; }
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
